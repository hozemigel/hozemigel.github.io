<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Join a squad on WannaGame</title>
<meta name="description" content="Someone wants you in their squad on WannaGame.">
<meta name="theme-color" content="#141518">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #141518; --tile: #25272C; --ink: #F2F3F5; --on-light: #0A0B0D;
    --w03: rgba(255,255,255,0.03); --w06: rgba(255,255,255,0.06); --w09: rgba(255,255,255,0.09);
    --w14: rgba(255,255,255,0.14); --t85: rgba(255,255,255,0.85); --t60: rgba(255,255,255,0.6);
    --t45: rgba(255,255,255,0.45);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--bg); color: var(--ink); font-family: Manrope, system-ui, sans-serif; }
  body { min-height: 100dvh; display: flex; flex-direction: column; padding: 20px 20px calc(28px + env(safe-area-inset-bottom)); max-width: 460px; margin: 0 auto; }
  .logo { font-family: Unbounded, sans-serif; font-weight: 600; font-size: 20px; letter-spacing: -0.5px; }
  .logo span { color: #8B9099; }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 14px; padding: 40px 0; }
  .avatar { width: 96px; height: 96px; border-radius: 29px; background: var(--tile); border: 1px solid var(--w09); display: grid; place-items: center; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .eyebrow { font-weight: 600; font-size: 14px; color: var(--t45); margin-top: 8px; }
  h1 { font-family: Unbounded, sans-serif; font-weight: 600; font-size: 28px; letter-spacing: -1px; line-height: 1.15; overflow-wrap: anywhere; }
  .meta { font-weight: 600; font-size: 14px; color: var(--t60); line-height: 1.5; }
  .actions { display: flex; flex-direction: column; gap: 10px; }
  .btn { display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 28px; font-weight: 800; font-size: 15px; text-decoration: none; }
  .btn.light { background: var(--ink); color: var(--on-light); }
  .note { font-weight: 600; font-size: 13px; color: var(--t45); text-align: center; line-height: 1.5; }
  .skeleton { color: transparent; background: var(--w06); border-radius: 8px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="logo">wanna<span>game</span></div>

  <main id="card">
    <div class="avatar" id="avatar" aria-hidden="true">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.5"/><path d="M15.8 14.2c2.4-.3 4.3 1.2 4.7 4"/></svg>
    </div>
    <p class="eyebrow" id="eyebrow">You’re invited to</p>
    <h1 id="name"><span class="skeleton">Loading squad</span></h1>
    <p class="meta" id="meta"></p>
  </main>

  <div class="actions" id="actions">
    <a class="btn light" id="open" href="#">Open in WannaGame</a>
    <p class="note">WannaGame is coming soon to Google Play.<br>Already have it? Tap the button above.</p>
  </div>

<script>
  const SUPABASE = 'https://yxymsbcsofljrclqwihq.supabase.co';
  const KEY = 'sb_publishable_usB93D-m8Y2arOJPLXCoKg_L0ZFW1Ce'; // public by design; RPC exposes only the invite card
  const m = location.pathname.toLowerCase().match(/^\/join\/([a-z0-9]{8,16})\/?$/);
  const $ = (id) => document.getElementById(id);

  function notFound(title, text) {
    $('eyebrow').hidden = true;
    $('name').textContent = title;
    $('meta').textContent = text;
    $('actions').hidden = true;
    document.title = 'WannaGame';
  }

  if (!m) {
    notFound('Nothing here', 'This page doesn’t exist. Invite links look like wannagame.stream/join/…');
  } else {
    const code = m[1];
    $('open').href = 'wannagame://join/' + code;
    fetch(SUPABASE + '/rest/v1/rpc/squad_invite_card', {
      method: 'POST',
      headers: { apikey: KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_code: code }),
    })
      .then((r) => (r.ok ? r.json() : Promise.reject(r.status)))
      .then((rows) => {
        const sq = rows[0];
        if (!sq) return notFound('Invite not found', 'The squad was deleted or the link is wrong. Ask for a new one.');
        $('name').textContent = sq.name;
        document.title = 'Join ' + sq.name + ' on WannaGame';
        const n = sq.member_count;
        const games = (sq.games || []).slice(0, 3).join(', ') + ((sq.games || []).length > 3 ? ' +' + (sq.games.length - 3) : '');
        $('meta').textContent = n + (n === 1 ? ' member' : ' members') + (games ? ' · ' + games : '');
        if (sq.avatar_url && sq.avatar_url.startsWith(SUPABASE + '/storage/')) {
          const img = new Image();
          img.alt = '';
          img.src = sq.avatar_url;
          img.onload = () => $('avatar').replaceChildren(img);
        }
      })
      .catch(() => {
        $('name').textContent = 'Squad invite';
        $('meta').textContent = 'Couldn’t load the details. The link still works in the app.';
      });
  }
</script>
</body>
</html>
